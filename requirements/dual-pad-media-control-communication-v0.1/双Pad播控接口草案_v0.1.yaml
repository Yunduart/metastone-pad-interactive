  - status
  - progress
  - muted
  - manifestVersion
  - revision

identifiers:
  controllerId:
    required: true
    note: Unique Pad identity; physical value pending site labeling.
  channel:
    required: true
    enum: [CASES, PRODUCTS]
  catalogId:
    required: true
    note: Fixed to the controller role; suggested cases/products naming is still reviewable.
  targetId:
    required: true
    note: Unique playback endpoint; physical mapping is P0 client pending.
  sessionId:
    required: true
    note: Active playback ownership and manifest snapshot.
  commandId:
    required: true
    note: Idempotency key; retries return the original result.
  topicId:
    required: true
  itemIndex:
    required: true
  itemType:
    required: true
    enum: [image, slide, video]
    note: slide is a PPT-exported image page, never native PPT.
  manifestVersion:
    required: true
  revision:
    required: true
    note: Monotonic authoritative state version.

catalogs:
  cases:
    controller_role: PAD_01
    topics:
      - {order: 1, topic_id: CASE_01, title: 大模型}
      - {order: 2, topic_id: CASE_02, title: 科研院所}
      - {order: 3, topic_id: CASE_03, title: 高端制造}
      - {order: 4, topic_id: CASE_04, title: 海洋模拟}
      - {order: 5, topic_id: CASE_05, title: 互联网}
      - {order: 6, topic_id: CASE_06, title: 航空航天}
      - {order: 7, topic_id: CASE_07, title: AI FOR SCIENCE}
  products:
    controller_role: PAD_02
    topics:
      - {order: 1, topic_id: PRODUCT_01, title: CLIENT_PENDING}
      - {order: 2, topic_id: PRODUCT_02, title: CLIENT_PENDING}
      - {order: 3, topic_id: PRODUCT_03, title: CLIENT_PENDING}
      - {order: 4, topic_id: PRODUCT_04, title: CLIENT_PENDING}
      - {order: 5, topic_id: PRODUCT_05, title: CLIENT_PENDING}
      - {order: 6, topic_id: PRODUCT_06, title: CLIENT_PENDING}
      - {order: 7, topic_id: PRODUCT_07, title: CLIENT_PENDING}

playlist_item:
  required_fields:
    - itemId
    - itemIndex
    - itemTitle
    - sourceType
    - sourceFileName
    - itemType
    - finalFileName
    - playMode
    - durationSeconds
    - endPolicy
    - version
  source_types: [image, ppt, video]
  playable_types: [image, slide, video]
  native_ppt_playback: false
  mixed_media_data_structure: CONFIRMED_REQUIREMENT
  automatic_advance_rules: CLIENT_PENDING
  play_modes: [manual_next, automatic]

ppt_policy:
  native_playback: FORBIDDEN
  no_animation_transition_audio:
    output: PNG_OR_JPG_PER_PAGE
    item_type: slide
  has_animation_transition_or_audio:
    output: H264_MP4
    item_type: video
    chapter_split: AS_NEEDED_CLIENT_PENDING

commands:
  - {action: OPEN_TOPIC, applies_to: playlist, status: DEVELOPMENT_PENDING}
  - {action: NEXT_ITEM, applies_to: playlist, status: DEVELOPMENT_PENDING}
  - {action: PREV_ITEM, applies_to: playlist, status: DEVELOPMENT_PENDING}
  - {action: JUMP_ITEM, applies_to: playlist, status: DEVELOPMENT_PENDING}
  - {action: PLAY, applies_to: current_item_or_video, status: DEVELOPMENT_PENDING}
  - {action: PAUSE, applies_to: video, status: DEVELOPMENT_PENDING}
  - {action: SEEK, applies_to: video, status: DEVELOPMENT_PENDING}
  - {action: MUTE, applies_to: video_or_target, status: DEVELOPMENT_PENDING}
  - {action: EXIT, applies_to: session, status: DEVELOPMENT_PENDING}

playback_states:
  - HOME_IDLE
  - TOPIC_LIST
  - PLAYLIST_READY
  - ITEM_LOADING
  - IMAGE_SHOWING
  - SLIDE_SHOWING
  - VIDEO_PLAYING
  - VIDEO_PAUSED
  - ITEM_END
  - WAIT_NEXT
  - SESSION_END
  - RETURN_HOME
  - ERROR
  - RECOVERING

connection_states: [OFFLINE, CONNECTING, ONLINE, RECOVERING]

endpoints:
  - id: controller_catalog
    method: GET
    path: /api/v1/controllers/{controllerId}/catalog
    response: [controllerId, channel, catalogId, topics, manifestVersion]
    status: DEVELOPMENT_PENDING
  - id: target_state
    method: GET
    path: /api/v1/targets/{targetId}
    response: [targetId, displayId, online, capabilities, currentSessionId, lastSeen]
    status: DEVELOPMENT_PENDING
  - id: create_session
    method: POST
    path: /api/v1/sessions
    request: [controllerId, channel, catalogId, targetId, topicId, manifestVersion]
    response: [sessionId, revision, status, binding]
    status: DEVELOPMENT_PENDING
  - id: command
    method: POST
    path: /api/v1/sessions/{sessionId}/commands
    request:
      required: [commandId, controllerId, channel, targetId, topicId, itemIndex, action, expectedRevision, sentAt]
      optional: [positionMs, muted]
    response: [accepted, duplicate, revision, status, error]
    status: DEVELOPMENT_PENDING
  - id: session_state
    method: GET
    path: /api/v1/sessions/{sessionId}
    response: [controllerId, channel, catalogId, targetId, sessionId, topicId, itemIndex, itemType, status, progress, muted, manifestVersion, revision, error]
    status: DEVELOPMENT_PENDING
  - id: events
    method: GET
    path: /api/v1/events
    query: [controllerId, targetId, afterEventId]
    response: [eventId, eventType, controllerId, channel, targetId, sessionId, revision, payload]
    status: DEVELOPMENT_PENDING
  - id: heartbeat
    method: POST
    path: /api/v1/endpoints/{endpointId}/heartbeat
    request: [role, controllerId, channel, targetId, capabilities, appVersion, bootId, sentAt]
    response: [serverTime, accepted, nextHeartbeatMs]
    status: DEVELOPMENT_PENDING
  - id: validate_manifest
    method: POST
    path: /api/v1/manifests/validate
    request: [manifestVersion, catalogs]
    response: [valid, errors, warnings]
    status: DEVELOPMENT_PENDING

error_codes:
  - {code: CONTROLLER_OFFLINE, http: 503, meaning: Pad heartbeat expired}
  - {code: TARGET_OFFLINE, http: 503, meaning: Playback endpoint heartbeat expired}
  - {code: CHANNEL_MISMATCH, http: 409, meaning: Controller is not authorized for the requested channel}
  - {code: TARGET_MISMATCH, http: 409, meaning: Controller/session is not bound to the requested target}
  - {code: TARGET_BUSY, http: 409, meaning: Another valid session owns the target}
  - {code: STALE_REVISION, http: 409, meaning: Client used an old authoritative revision}
  - {code: SESSION_MISMATCH, http: 409, meaning: Command session does not own the target}
  - {code: COMMAND_DUPLICATE, http: 200, meaning: Return original result without re-execution}
  - {code: ITEM_NOT_FOUND, http: 404, meaning: Item is absent from the frozen manifest}
  - {code: MEDIA_MISSING, http: 422, meaning: Final delivery file is absent}
  - {code: NATIVE_PPT_REJECTED, http: 422, meaning: Native PPT is not a playable item}
  - {code: MEDIA_UNSUPPORTED, http: 422, meaning: Final type or codec is unsupported}
  - {code: LOAD_FAILED, http: 422, meaning: Target failed to load media}
  - {code: DECODE_FAILED, http: 422, meaning: Target failed to decode media}
  - {code: DURATION_REQUIRED, http: 422, meaning: Automatic image or slide item lacks duration}
  - {code: LOAD_TIMEOUT, http: 504, meaning: Target did not load media within the configured threshold}
  - {code: AUTOPLAY_BLOCKED, http: 409, meaning: Browser or device autoplay permission is not enabled}

